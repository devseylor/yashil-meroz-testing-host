<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | yashil_meros</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      /* --- ОСНОВНОЕ ОФОРМЛЕНИЕ --- */
      body {
        padding: 0;
        margin: 0;
        background: initial;
        background-color: initial;
      }

      #unity-container {
        position: relative;
        background: url('TemplateData/image_66a78f.jpg') no-repeat center center;
        background-size: cover;
        background-color: transparent !important;
      }

      #unity-canvas {
        background: transparent !important;
      }

      /* --- ГОЛУБОЙ ПРОГРЕСС-БАР --- */
      #unity-loading-bar {
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          width: 80%;
          max-width: 500px;
          height: 22px;

          display: none;

          background: rgba(255,255,255,0.15);
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }

      #unity-progress-bar {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        overflow: hidden;
      }

      #progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4db8ff, #0077ff);
        border-radius: 12px 0 0 12px;
        box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.4);
        transition: width 0.3s ease-out;
        overflow: hidden;
      }

      #progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(120deg, rgba(255, 255, 255, 0.45), transparent);
        border-radius: inherit;
        animation: shine 1.5s infinite;
      }

      @keyframes shine {
        from { left: -40%; }
        to { left: 100%; }
      }

      /* --- ЛОГО И ФАКТЫ --- */
      #custom-header-logo {
        position: absolute;
        top: 15%;
        left: 20%;
        transform: translateX(-50%);
        width: 120px;
        height: 30px;
        background: url('TemplateData/click_logo.png') no-repeat center center;
        background-size: contain;
        z-index: 10;
      }

      #fun-fact-box {
        position: absolute;
        left: 50%;
        bottom: 5%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 520px;

        padding: 24px 26px;

        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        color: white;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);

        font-family: Arial, sans-serif;
        text-align: left;
      }

      #fun-fact-box b,
      #fun-fact-box .headline {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
        color: white;
      }

      #fun-fact-box .fact-text {
        font-size: 15px;
        line-height: 1.45;
        opacity: 0.92;
      }
    </style>
  </head>

  <body>
    <div id="custom-header-logo"></div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-progress-bar">
          <div id="progress-fill"></div>
        </div>
      </div>

      <div id="fun-fact-box">
        <div class="headline">Интересный факт</div>
        <div class="fact-text"></div>
      </div>

      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">yashil_meros</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Builds.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Builds.data.unityweb",
        frameworkUrl: buildUrl + "/Builds.framework.js.unityweb",
        codeUrl: buildUrl + "/Builds.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "yashil_meros",
        productVersion: "0.1.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      const facts = [
        "В Узбекистане растут чинары (платаны восточные), возраст которых превышает 1000 лет. Они являются живыми свидетелями истории.",
        "Чинара славится своей огромной раскидистой кроной, которая может создавать тень на площади до 400-500 квадратных метров.",
        "Саксаул - главное дерево пустынь Узбекистана. Его корни уходят на десятки метров вглубь в поисках воды, укрепляя пески.",
        "Ива белая, растущая вдоль арыков и рек, за сутки может выкачать из почвы и испарить через листья до 250 литров воды.",
        "Дикая фисташка - одно из древнейших растений Средней Азии. Это дерево-долгожитель, приспособившееся к каменистым склонам.",
        "Знаменитый шелковый путь проходил через оазисы, созданные руками человека с помощью посадок тополей и ив.",
        "В Узбекистане из сока местного вида клена (клён туркестанский) также можно добывать сладкий сироп, хотя это не так распространено, как в Канаде.",
        "В горах Узбекистана существуют уникальные естественные рощи грецкого ореха, например, в Чаткальских горах.",
        "В Узбекистане встречаются деревья, которые являются эндемиками (больше нигде в мире не растут) и реликтами, как некоторые виды яблонь и боярышника.",
        "Для борьбы с высыханием Аральского моря и опустыниванием в Узбекистане высаживаются миллионы саженцев drought-resistant (засухоустойчивых) деревьев, создавая новые леса."
      ];

      function setRandomFact() {
          const factBox = document.querySelector("#fun-fact-box .fact-text");
          factBox.textContent = facts[Math.floor(Math.random() * facts.length)];
      }

      setRandomFact();

      /* 🔥🔥 ПРАВИЛЬНОЕ РАСПОЛОЖЕНИЕ ПРОГРЕСС-БАРА 🔥🔥 */
      function updateProgressBarPosition() {
          const fact = document.getElementById("fun-fact-box");
          const bar = document.getElementById("unity-loading-bar");

          const rect = fact.getBoundingClientRect();

          // расстояние от низа экрана до верха факта
          const distanceFromBottom = window.innerHeight - rect.top;

          // ставим прогресс-бар строго над фактом
          bar.style.bottom = (distanceFromBottom + 20) + "px";
          bar.style.top = "auto"; // важно!
      }

      setTimeout(updateProgressBarPosition, 0);
      setTimeout(updateProgressBarPosition, 100);
      setTimeout(updateProgressBarPosition, 300);
      setTimeout(updateProgressBarPosition, 600);
      window.addEventListener("resize", updateProgressBarPosition);

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#progress-fill").style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#custom-header-logo").style.display = "none";
          document.querySelector("#fun-fact-box").style.display = "none";

          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
      let lastHeight = window.innerHeight;

      function fixUnityViewportAfterKeyboard() {
          const newHeight = window.innerHeight;

          // Срабатывает только когда клавиатура открылась или закрылась
          if (Math.abs(newHeight - lastHeight) > 100) {
              if (typeof Module !== 'undefined' && Module.canvas) {
                  Module.canvas.width = window.innerWidth;
                  Module.canvas.height = window.innerHeight;

                  if (Module.resizeCanvas) {
                      Module.resizeCanvas();
                  }
              }
          }

          lastHeight = newHeight;
      }

      window.addEventListener("resize", fixUnityViewportAfterKeyboard);
      window.addEventListener("orientationchange", fixUnityViewportAfterKeyboard);
    </script>
  </body>
</html>
